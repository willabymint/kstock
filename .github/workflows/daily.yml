name: daily-screen
on:
  schedule:
    - cron: "40 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Run pipeline
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python -m pipeline.run
      - name: Commit data
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/latest.json docs/data/history.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
